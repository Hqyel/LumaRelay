name: lumarelay

services:
  proxy:
    image: caddy:2.10-alpine
    profiles:
      - https
    depends_on:
      - app
    environment:
      LUMARELAY_DOMAIN: ${LUMARELAY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_config:/config
      - caddy_data:/data

  app:
    image: ghcr.io/hqyel/lumarelay:${LUMARELAY_IMAGE_TAG:-edge}
    env_file:
      - .env
    environment:
      LUMARELAY_COOKIE_SECURE: "true"
      LUMARELAY_DATABASE_PATH: /data/lumarelay.db
      NODE_ENV: production
    expose:
      - "3000"
    restart: unless-stopped
    volumes:
      - lumarelay_data:/data

volumes:
  caddy_config:
  caddy_data:
  lumarelay_data:
