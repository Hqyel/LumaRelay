name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lumarelay

jobs:
  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.description=LumaRelay media dashboard and local-player gateway
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=LumaRelay
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}

      - name: Publish summary
        run: |
          {
            echo "### Container"
            echo
            echo "\`${IMAGE_NAME}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

  release:
    name: GitHub prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - container
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.422

      - name: Publish Windows Player Bridge
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          dotnet publish `
            apps/player-bridge/src/LumaRelay.PlayerBridge/LumaRelay.PlayerBridge.csproj `
            --configuration Release `
            --framework net8.0-windows10.0.19041.0 `
            --output artifacts/win-x64 `
            -p:Version=$version

          $archive = "LumaRelay.PlayerBridge-${env:GITHUB_REF_NAME}-win-x64.zip"
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii SHA256SUMS

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archive = "LumaRelay.PlayerBridge-$tag-win-x64.zip"
          $notes = @"
          Container image: ``ghcr.io/${env:GITHUB_REPOSITORY_OWNER}/lumarelay@$env:IMAGE_DIGEST``
          "@
          $arguments = @(
            "release", "create", $tag,
            $archive, "SHA256SUMS",
            "--generate-notes",
            "--notes", $notes,
            "--title", "LumaRelay $tag"
          )
          if($tag.Contains("-")) {
            $arguments += "--prerelease"
          }
          gh @arguments
