name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bridge:
    name: Windows Player Bridge
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.422

      - name: Restore
        run:
          dotnet restore apps/player-bridge/LumaRelay.PlayerBridge.sln
          --locked-mode

      - name: Check formatting
        run:
          dotnet format apps/player-bridge/LumaRelay.PlayerBridge.sln
          --verify-no-changes --no-restore

      - name: Build
        run:
          dotnet build apps/player-bridge/LumaRelay.PlayerBridge.sln
          --configuration Release --no-restore

      - name: Test
        run:
          dotnet test apps/player-bridge/LumaRelay.PlayerBridge.sln
          --configuration Release --no-build

      - name: Publish win-x64
        run: >-
          dotnet publish
          apps/player-bridge/src/LumaRelay.PlayerBridge/LumaRelay.PlayerBridge.csproj
          --configuration Release --framework net8.0-windows10.0.19041.0
          --output artifacts/win-x64

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit public repository data
        run: pnpm audit:public

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run:
          pnpm --filter "!@lumarelay/player-bridge" --recursive --if-present
          lint

      - name: Typecheck
        run:
          pnpm --filter "!@lumarelay/player-bridge" --recursive --if-present
          typecheck

      - name: Unit tests
        run:
          pnpm --filter "!@lumarelay/player-bridge" --recursive --if-present
          test

      - name: Build
        run:
          pnpm --filter "!@lumarelay/player-bridge" --recursive --if-present
          build

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Authentication and page regression
        run: pnpm test:e2e

      - name: Production performance budget
        run: pnpm test:performance

      - name: Chromium and Firefox compatibility
        run: pnpm test:compat

      - name: Visual regression
        run: pnpm test:visual
